<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscar Post</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            padding: 8px;
        }
        #resultado {
            margin-top: 20px;
        }
        .erro {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Buscar Post</h1>

    <input type="number" id="inputId" placeholder="Digite o ID">
    <button onclick="buscarPost()">Buscar</button>

    <div id="resultado"></div>

    <script>
        
        const posts = [
            { userId: 1, id: 1, title: "Primeiro post", body: "Aprendendo a manipular o DOM." },
            { userId: 1, id: 2, title: "Segundo post", body: "Arrays de objetos são parecidos com o JSON de uma API." },
            { userId: 2, id: 3, title: "Terceiro post", body: "Em breve vamos buscar estes dados no servidor." },
            { userId: 2, id: 4, title: "Quarto post", body: "O método find devolve o primeiro item encontrado." },
            { userId: 3, id: 5, title: "Quinto post", body: "Se nada for encontrado, find devolve undefined." }
        ];

        function buscarPost() {
            
            const divResultado = document.getElementById('resultado');
            const inputId = document.getElementById('inputId');
            const idDigitado = inputId.value;

            divResultado.innerHTML = '';
            divResultado.classList.remove('erro'); 

            if (idDigitado === '') {
                divResultado.textContent = "Digite um ID.";
                return; 
            }

            const idNumerico = Number(idDigitado);

            const postEncontrado = posts.find(post => post.id === idNumerico);


            if (!postEncontrado) {
                divResultado.textContent = `Post não encontrado (ID ${idNumerico}). Os IDs válidos vão de 1 a 5.`;
                divResultado.classList.add('erro'); 
            } else {

                const titulo = document.createElement('h2');
                titulo.textContent = postEncontrado.title;
                
                const corpo = document.createElement('p');
                corpo.textContent = postEncontrado.body;

                divResultado.appendChild(titulo);
                divResultado.appendChild(corpo);
            }
        }
    </script>

</body>
</html>
