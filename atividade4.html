<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Comentários por Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        select {
            padding: 5px;
            margin-bottom: 20px;
        }
        .comentario {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            width: 500px;
        }
        .comentario p {
            margin: 5px 0;
        }

        .escondido {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Comentários por Post</h1>

    <label for="selectPost">Selecione um post:</label>
    <br><br>

    <select id="selectPost">
       
        <option value="">Selecione um post</option>
    </select>

    <h2 id="tituloComentarios" class="escondido"></h2>

    <div id="areaComentarios"></div>

    <script>
        
        const posts = [
            { id: 1, title: "Introdução ao DOM" },
            { id: 2, title: "Eventos em JavaScript" },
            { id: 3, title: "O que é uma API?" }
        ];

        const comentarios = [
            { postId: 1, id: 1, name: "Ana", email: "ana@email.com", body: "Explicação muito clara!" },
            { postId: 1, id: 2, name: "Bruno", email: "bruno@email.com", body: "Gostei do exemplo do getElementById." },
            { postId: 2, id: 3, name: "Carla", email: "carla@email.com", body: "addEventListener é bem melhor que onclick." },
            { postId: 3, id: 4, name: "Diego", email: "diego@email.com", body: "A analogia do garçom ajudou muito." },
            { postId: 3, id: 5, name: "Elisa", email: "elisa@email.com", body: "Quero testar o JSONPlaceholder!" },
            { postId: 3, id: 6, name: "Fábio", email: "fabio@email.com", body: "E o método POST, como funciona?" }
        ];

       
        const selectPost = document.getElementById('selectPost');
        const tituloComentarios = document.getElementById('tituloComentarios');
        const areaComentarios = document.getElementById('areaComentarios');

        posts.forEach(post => {
            
            const option = document.createElement('option');

            option.value = post.id; 

            option.textContent = post.title; 

            selectPost.appendChild(option);
        });

        selectPost.addEventListener('change', function() {
            
            const postIdSelecionado = selectPost.value;

            areaComentarios.innerHTML = '';

            if (postIdSelecionado === "") {
                tituloComentarios.classList.add('escondido');
                return; 
            }

            const comentariosDoPost = comentarios.filter(
                comentario => comentario.postId === Number(postIdSelecionado)
            );

            tituloComentarios.textContent = `Comentários (${comentariosDoPost.length})`;
            tituloComentarios.classList.remove('escondido');

            comentariosDoPost.forEach(comentario => {
                
                const divComentario = document.createElement('div');
                divComentario.classList.add('comentario');

                const nome = document.createElement('h3');
                nome.textContent = comentario.name;

                const email = document.createElement('p');
                email.innerHTML = `<strong>E-mail:</strong> ${comentario.email}`;

                const corpo = document.createElement('p');
                corpo.textContent = comentario.body;

                divComentario.appendChild(nome);
                divComentario.appendChild(email);
                divComentario.appendChild(corpo);

                areaComentarios.appendChild(divComentario);
            });
        });
    </script>

</body>
</html>
